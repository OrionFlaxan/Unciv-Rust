[package]
name = "unciv-native"
version = "0.1.0"
edition = "2021"
description = "Native (Rust) performance engine for Unciv: pathfinding, line-of-sight, map generation and save compression"
license = "MPL-2.0"
publish = false

[lib]
name = "unciv_native"
crate-type = ["cdylib", "rlib"]

[dependencies]
jni = { version = "0.21", default-features = false }
flate2 = { version = "1", default-features = false, features = ["zlib-rs"] }
base64 = "0.22"
